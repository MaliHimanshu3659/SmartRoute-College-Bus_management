<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile — SmartRoute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">SR</div>
                <div class="sidebar-brand-name">SmartRoute</div>
            </div>

            <div class="sidebar-section-label">Student Menu</div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="student-dashboard.html">
                    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item" href="availability.html">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                    <span>Today's Availability</span>
                </a>
                <a class="nav-item" href="attendance.html">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span>Attendance History</span>
                </a>
                <a class="nav-item active" href="student-profile.html">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>Student Profile</span>
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="user-avatar" id="sidebar-user-avatar">SR</div>
                <div class="user-info">
                    <div class="user-name" id="sidebar-user-name">Loading...</div>
                    <span class="user-role-badge" id="sidebar-user-role">Student</span>
                </div>
                <button class="logout-btn" id="logout-btn" title="Sign Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="alert-container"></div>

            <div class="page-header">
                <div>
                    <h1 class="page-title">Student Profile</h1>
                    <p class="page-subtitle">Manage your college transit contact details and academic information.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Personal & Academic Details</span>
                    <span class="badge badge-teal">Student Account</span>
                </div>
                <div class="card-body">
                    <form id="profile-form">
                        <div class="row g-3">
                            <div class="col-md-6 form-group">
                                <label class="form-label">Full Name *</label>
                                <input type="text" id="full_name" class="form-control" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label">Username (Read-Only)</label>
                                <input type="text" id="username" class="form-control" disabled>
                            </div>

                            <div class="col-md-6 form-group">
                                <label class="form-label">Enrollment Number</label>
                                <input type="text" id="enrollment_number" class="form-control" placeholder="e.g. 2024BTCS001">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label">Student Mobile Number</label>
                                <input type="tel" id="mobile_number" class="form-control" placeholder="10-digit mobile">
                            </div>

                            <div class="col-md-6 form-group">
                                <label class="form-label">Program</label>
                                <input type="text" id="program" class="form-control" placeholder="e.g. B.Tech">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label">Branch / Department</label>
                                <input type="text" id="branch" class="form-control" placeholder="e.g. Computer Science & Engineering">
                            </div>

                            <div class="col-md-6 form-group">
                                <label class="form-label">Study Year</label>
                                <select id="study_year" class="form-control">
                                    <option value="">Select Year</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label">Specialization</label>
                                <input type="text" id="specialization" class="form-control" placeholder="e.g. Full Stack Development">
                            </div>

                            <div class="col-md-6 form-group">
                                <label class="form-label">Parent / Guardian Name</label>
                                <input type="text" id="parent_name" class="form-control">
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label">Parent Emergency Mobile</label>
                                <input type="tel" id="parent_mobile_number" class="form-control">
                            </div>

                            <div class="col-12 form-group">
                                <label class="form-label">Residential Address</label>
                                <textarea id="address" class="form-control" rows="2" placeholder="Local address in Udaipur..."></textarea>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-end">
                            <button type="submit" id="save-btn" class="btn btn-teal px-4">
                                Save Profile Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        async function loadProfile() {
            try {
                const res = await fetchApi('/availability/profile');
                if (!res || !res.success) return;

                const p = res.profile;
                document.getElementById('full_name').value = p.full_name || '';
                document.getElementById('username').value = p.username || '';
                document.getElementById('enrollment_number').value = p.enrollment_number || '';
                document.getElementById('mobile_number').value = p.mobile_number || '';
                document.getElementById('program').value = p.program || '';
                document.getElementById('branch').value = p.branch || '';
                document.getElementById('study_year').value = p.study_year || '';
                document.getElementById('specialization').value = p.specialization || '';
                document.getElementById('parent_name').value = p.parent_name || '';
                document.getElementById('parent_mobile_number').value = p.parent_mobile_number || '';
                document.getElementById('address').value = p.address || '';
            } catch (err) {
                showAlert('Failed to load profile details.', 'danger');
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const body = {
                    fullName: document.getElementById('full_name').value.trim(),
                    enrollmentNumber: document.getElementById('enrollment_number').value.trim(),
                    mobileNumber: document.getElementById('mobile_number').value.trim(),
                    program: document.getElementById('program').value.trim(),
                    branch: document.getElementById('branch').value.trim(),
                    studyYear: document.getElementById('study_year').value,
                    specialization: document.getElementById('specialization').value.trim(),
                    parentName: document.getElementById('parent_name').value.trim(),
                    parentMobileNumber: document.getElementById('parent_mobile_number').value.trim(),
                    address: document.getElementById('address').value.trim()
                };

                const res = await fetchApi('/availability/profile', {
                    method: 'POST',
                    body
                });

                if (res && res.success) {
                    showAlert('Profile updated successfully!', 'success');
                    // Refresh sidebar
                    checkAuth('student');
                }
            } catch (err) {
                showAlert(err.message || 'Error updating profile.', 'danger');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Profile Changes';
            }
        });

        (async () => {
            await checkAuth('student');
            loadProfile();
        })();
    </script>
</body>
</html>
